<!DOCTYPE html>
<html>
<head>
<title>Modificari cu functie JavaScript</title>
<script>
function myFunction() {
    var p1 = document.getElementById("p1");
    var p2 = document.getElementById("p2");
    var p3 = document.getElementById("p3");

    p1.innerHTML = "Acesta este paragraful 1";
    p1.style.color = "white";
    p1.style.backgroundColor = "blue";

    p2.innerHTML = "Acesta este paragraful 2";
    p2.style.color = "yellow";
    p2.style.backgroundColor = "green";

    p3.innerHTML = "Acesta este paragraful 3";
    p3.style.color = "brown";
    p3.style.backgroundColor = "pink";
}
</script>
</head>
<body>

<h1>Modificari la click pe buton</h1>

<p id="p1">Paragraf 1</p>
<p id="p2">Paragraf 2</p>
<p id="p3">Paragraf 3</p>

<button type="button" onclick="myFunction()">Apasa-ma!</button>

</body>
</html>
