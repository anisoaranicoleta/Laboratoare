<!DOCTYPE html>
<html>
<head>
<title> Becuri </title>

<script>
function light(sw) {
    var pic;
    if (sw == 0) {
        pic = "pic_bulboff.gif";
    } else {
        pic = "pic_bulbon.gif";
    }
    document.getElementById('bec1').src = pic;
}
function changeImage() {
    var image = document.getElementById('bec2');
    if (image.src.includes("bulbon")) {
        image.src = "pic_bulboff.gif";
    } else {
        image.src = "pic_bulbon.gif";
    }
}
</script>
</head>
<body>

<h1>Becuri - 2 variante</h1>

<p>
<img id="bec1" src="pic_bulboff.gif" width="100" height="180" onmouseover="light(1)" onmouseout="light(0)">
</p>

<p>
<button type="button" onclick="light(1)">Light On</button>
<button type="button" onclick="light(0)">Light Off</button>
</p>

<img id="bec2" src="pic_bulboff.gif" width="100" height="180" onmouseover="changeImage()" onmouseout="changeImage()">

<p>Move the mouse over the light bulb to turn on/off the light.</p>

</body>
</html>
